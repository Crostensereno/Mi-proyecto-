<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ======================= TEXTOS EDITABLES =======================
const CONFIG = {
  ctaPregunta: '¿Quieres el paso a paso completo?',
  ctaTitulo1: 'Consigue el manual',
  ctaTitulo2: 'en PDF',
  beneficios: [

    'Consejos para un acabado pro',
  ],
  boton: 'Descárgalo ahora',

  portadaLinea2: 'Sudadera con',
  portadaLinea3: 'capucha · hombre',
  // Gancho del primer segundo
  gancho1: '¿HARTO DE PAGAR',
  ganchoPrecio: '40 €',
  gancho2: 'POR UNA SUDADERA?',
  ganchoSello: '¡HAZTE LA TUYA!',
};
// Lo que dice el muñeco en cada escena (tono cercano)
const DIALOGO = {
  intro: 'Te enseño en un minuto, paso a paso. ¡Y sin llorar!',
  materiales: 'Apunta: felpa, rib, hilo, tijeras, clips... ¡y paciencia, que esa no se vende!',
  cortar: 'Patrón encima, tijeras en mano... ¡y corta sin miedo, valiente!',
  bolsillo: 'El bolsillo canguro: dobla, cose y listo. Ahí van tus manos... o tus chuches.',
  hombros: 'Delantero y espalda, derecho con derecho. ¡Como dos colegas dándose un abrazo!',
  capucha: 'Ahora la capucha, al escote. ¡Para tus días de no me habléis!',
  mangas: 'Las mangas: el centro, con la costura del hombro. ¡Que no te quede torcida!',
  costados: 'Y cerramos de un tirón, del puño hasta abajo. ¡Zas!',
  rib: 'Puños y pretina: estira un poquito el rib... ¡pero sin pasarte, eh!',
  final: '¡Tachán! Hecha por ti y a tu medida. ¿A\u00a0que mola?',
  cta: '¡Todos los trucos están en mi PDF!',
};
const SPEED = 1.5; // velocidad del vídeo
// ================================================================

const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  bg: '#F5EFE6', grid: '#E9DECD', ink: '#2B2D42', muted: '#5E6174',
  fab: '#46597A', fabD: '#364660', fabL: '#5A7096', rib: '#33425A',
  line: '#26324A', inside: '#222C40', acc: '#E07A3F', acc2: '#F2B544',
  stitch: '#FFE7C2', paper: '#FFFFFF', dark: '#23253A',
};

// ---------- utilidades ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = t => 1 - Math.pow(1 - t, 3);
const eInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

function qb(p0, p1, p2, n = 18) {
  const r = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    r.push([u*u*p0[0] + 2*u*t*p1[0] + t*t*p2[0], u*u*p0[1] + 2*u*t*p1[1] + t*t*p2[1]]);
  }
  return r;
}
function build(spec) {
  const pts = [];
  for (const s of spec) {
    if (Array.isArray(s)) pts.push(s);
    else { const c = qb(pts[pts.length - 1], s.q[0], s.q[1]); c.shift(); pts.push(...c); }
  }
  return pts;
}
const mirror = pts => pts.map(([x, y]) => [-x, y]);
const xf = (pts, ox, oy, s, mx = 1) => pts.map(([x, y]) => [ox + s * x * mx, oy + s * y]);
function inset(pts, f, c) { return pts.map(([x, y]) => [c[0] + (x - c[0]) * f, c[1] + (y - c[1]) * f]); }
const closed = pts => [...pts, pts[0]];

function tracePts(pts, close = true) {
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  if (close) ctx.closePath();
}
function fillPts(pts, fill, stroke, lw = 4) {
  tracePts(pts);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function polyLen(pts) {
  const L = [0];
  for (let i = 1; i < pts.length; i++) L.push(L[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
  return L;
}
function partial(pts, p) {
  const L = polyLen(pts), target = L[L.length - 1] * p, out = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    if (L[i] <= target) out.push(pts[i]);
    else {
      const f = (target - L[i-1]) / (L[i] - L[i-1] || 1);
      out.push([lerp(pts[i-1][0], pts[i][0], f), lerp(pts[i-1][1], pts[i][1], f)]);
      break;
    }
  }
  return out;
}
function tangentAt(pts, p) {
  const q = partial(pts, clamp(p, 0.001, 1));
  const a = q[q.length - 2] || pts[0], b = q[q.length - 1];
  return { pt: b, ang: Math.atan2(b[1] - a[1], b[0] - a[0]) };
}
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
}
function shadow(on, blur = 30, oy = 14, a = 0.18) {
  if (on) { ctx.shadowColor = `rgba(50,35,20,${a})`; ctx.shadowBlur = blur; ctx.shadowOffsetY = oy; }
  else { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; }
}
function wrapLines(text, maxW) {
  const words = text.split(' '); let line = ''; const lines = [];
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  lines.push(line); return lines;
}

// ---------- geometría de la sudadera (vista frontal montada) ----------
const G = {};
G.torso = build([[-70,-10], {q:[[0,75],[70,-10]]}, [170,25], [185,190], [185,520], [-185,520], [-185,190], [-170,25]]);
G.back  = build([[-70,-10], {q:[[0,12],[70,-10]]}, [170,25], [185,190], [185,520], [-185,520], [-185,190], [-170,25]]);
G.sleeveR = build([[170,25], {q:[[285,110],[322,452]]}, [252,478], {q:[[225,300],[185,190]]}]);
G.sleeveL = mirror(G.sleeveR);
G.cuffR = [[322,452],[338,522],[270,546],[252,478]];
G.cuffL = mirror(G.cuffR);
G.band = [[-185,518],[185,518],[178,600],[-178,600]];
G.hood = build([[-80,30], {q:[[-180,-150],[-60,-255]]}, {q:[[0,-292],[60,-255]]}, {q:[[180,-150],[80,30]]}]);
G.hoodIn = build([[-50,30], {q:[[-118,-125],[-36,-205]]}, {q:[[0,-228],[36,-205]]}, {q:[[118,-125],[50,30]]}]);
G.pocket = build([[-100,300],[100,300], {q:[[115,430],[172,462]]}, [172,506], [-172,506], [-172,462], {q:[[-115,430],[-100,300]]}]);

const SE = {
  pocket: closed(inset(G.pocket, 0.9, [0, 415])),
  shL: [[-70,-10],[-170,25]], shR: [[70,-10],[170,25]],
  neck: qb([-70,-10],[0,75],[70,-10],30),
  armL: [[-170,25],[-185,190]], armR: [[170,25],[185,190]],
  sideR: [...qb([252,478],[225,300],[185,190],20), [185,518]],
  cuffR: [[322,452],[252,478]],
  band: [[-185,518],[185,518]],
};
SE.sideL = mirror(SE.sideR); SE.cuffL = mirror(SE.cuffR);

// piezas planas (patrón)
const FL = {};
FL.sleeve = build([[-130,110], {q:[[0,-40],[130,110]]}, [80,520], [-80,520]]);
FL.hood = build([[0,380],[0,60], {q:[[30,0],[150,0]]}, {q:[[290,20],[290,200]]}, {q:[[285,340],[220,380]]}]);
FL.pocket = G.pocket.map(([x,y]) => [x, y - 400]);

// ---------- dibujo de elementos ----------
function ribFill(pts, step = 13) {
  ctx.save();
  fillPts(pts, C.rib);
  tracePts(pts); ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 4;
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  for (let x = Math.min(...xs) - 20; x < Math.max(...xs) + 20; x += step) {
    ctx.beginPath(); ctx.moveTo(x, Math.min(...ys) - 5); ctx.lineTo(x + 6, Math.max(...ys) + 5); ctx.stroke();
  }
  ctx.restore();
  fillPts(pts, null, C.line, 4);
}

function drawNeedle(x, y, t) {
  const bob = (Math.sin(t * 28) * 0.5 + 0.5) * 16;
  ctx.save();
  ctx.translate(x, y - bob);
  // hilo
  ctx.strokeStyle = C.acc; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -104); ctx.quadraticCurveTo(60, -150, 40, -230); ctx.stroke();
  // aguja
  const g = ctx.createLinearGradient(-5, 0, 5, 0);
  g.addColorStop(0, '#9AA3AF'); g.addColorStop(.5, '#F4F6F8'); g.addColorStop(1, '#8B94A1');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(-5, -120); ctx.lineTo(5, -120); ctx.lineTo(4, -12); ctx.lineTo(0, 0); ctx.lineTo(-4, -12); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#6E7682'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.ellipse(0, -106, 1.6, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // destello en el punto
  ctx.fillStyle = 'rgba(242,181,68,0.55)';
  ctx.beginPath(); ctx.arc(x, y, 9 + Math.sin(t * 28) * 3, 0, Math.PI * 2); ctx.fill();
}

function drawStitch(pts, p, t, { needle = true, alpha = 1, color = C.stitch, w = 5 } = {}) {
  if (p <= 0) return;
  const q = partial(pts, clamp(p));
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.setLineDash([15, 10]); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = color; ctx.lineWidth = w;
  tracePts(q, false); ctx.stroke();
  ctx.restore();
  if (needle && p < 1) { const tip = q[q.length - 1]; drawNeedle(tip[0], tip[1], t); }
}

function drawHoodie(cx, cy, s, st, t) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  const grad = ctx.createLinearGradient(0, -280, 0, 600);
  grad.addColorStop(0, C.fabL); grad.addColorStop(1, C.fab);
  const fold = 'rgba(20,28,45,0.16)';

  if (st.back) {
    ctx.save(); ctx.globalAlpha = st.back.a ?? 1; ctx.translate(st.back.dx || 0, st.back.dy || 0);
    shadow(1); fillPts(G.back, C.fabD); shadow(0); fillPts(G.back, null, C.line, 4);
    ctx.restore();
  }
  if (st.hood) {
    ctx.save(); ctx.globalAlpha = st.hood.a ?? 1; ctx.translate(0, st.hood.dy || 0);
    shadow(1); fillPts(G.hood, grad); shadow(0); fillPts(G.hood, null, C.line, 4);
    fillPts(G.hoodIn, C.inside);
    tracePts(G.hoodIn); ctx.strokeStyle = C.fabL; ctx.lineWidth = 12; ctx.stroke();
    tracePts(G.hoodIn); ctx.strokeStyle = C.line; ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
  }
  if (st.sleeves) {
    for (const [pts, k] of [[G.sleeveR, 1], [G.sleeveL, -1]]) {
      ctx.save(); ctx.globalAlpha = st.sleeves.a ?? 1; ctx.translate(k * (st.sleeves.dx || 0), st.sleeves.dy || 0);
      shadow(1); fillPts(pts, grad); shadow(0); fillPts(pts, null, C.line, 4);
      ctx.strokeStyle = fold; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(k*228, 230); ctx.quadraticCurveTo(k*250, 300, k*262, 350); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(k*270, 390); ctx.quadraticCurveTo(k*282, 410, k*300, 418); ctx.stroke();
      ctx.restore();
    }
  }
  if (st.cuffs) {
    ctx.save(); ctx.globalAlpha = st.cuffs.a ?? 1; ctx.translate(0, st.cuffs.dy || 0);
    shadow(1, 16, 8); fillPts(G.cuffR, C.rib); fillPts(G.cuffL, C.rib); shadow(0);
    ribFill(G.cuffR); ribFill(G.cuffL);
    ctx.restore();
  }
  if (st.torso) {
    shadow(1); fillPts(G.torso, grad); shadow(0); fillPts(G.torso, null, C.line, 4);
    ctx.strokeStyle = fold; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-150, 210); ctx.quadraticCurveTo(-140, 260, -146, 300); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(150, 210); ctx.quadraticCurveTo(140, 260, 146, 300); ctx.stroke();
  }
  if (st.band) {
    ctx.save(); ctx.globalAlpha = st.band.a ?? 1; ctx.translate(0, st.band.dy || 0);
    shadow(1, 16, 8); fillPts(G.band, C.rib); shadow(0); ribFill(G.band);
    ctx.restore();
  }
  if (st.pocket) {
    ctx.save(); ctx.globalAlpha = st.pocket.a ?? 1; ctx.translate(0, st.pocket.dy || 0);
    shadow(1, 14, 6, 0.22); fillPts(G.pocket, C.fab); shadow(0); fillPts(G.pocket, null, C.line, 4);
    ctx.restore();
  }
  if (st.strings) {
    ctx.save(); ctx.globalAlpha = st.strings;
    for (const k of [-1, 1]) {
      ctx.fillStyle = '#C9CFDA'; ctx.beginPath(); ctx.arc(k*28, 24, 7, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = C.stitch; ctx.lineWidth = 9; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(k*28, 24); ctx.quadraticCurveTo(k*48, 110, k*(34 + (k>0?4:0)), 190); ctx.stroke();
      ctx.fillStyle = C.acc; rr(k*(34 + (k>0?4:0)) - 7, 186, 14, 28, 5); ctx.fill();
    }
    ctx.restore();
  }
  for (const sm of (st.seams || [])) drawStitch(sm[0], sm[1], t, { alpha: sm[2] ?? 1, needle: sm[3] ?? true });
  ctx.restore();
}

function drawScissors(x, y, ang, open, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
  ctx.translate(-34, 0);
  for (const k of [-1, 1]) {
    ctx.save(); ctx.rotate(k * open);
    // mango
    ctx.strokeStyle = C.acc; ctx.lineWidth = 11; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-40, k * 18); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-62, k * 26, 22, 15, k * 0.3, 0, Math.PI * 2); ctx.stroke();
    // hoja
    ctx.fillStyle = '#D3D8DF'; ctx.strokeStyle = '#7D8592'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-6, -k * 2); ctx.lineTo(88, 0); ctx.lineTo(-6, k * 9); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function background(dark = 0) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = C.grid; ctx.lineWidth = 2;
  for (let x = 60; x < W; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 40; y < H; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  if (dark > 0) { ctx.globalAlpha = dark; ctx.fillStyle = C.dark; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

// ---------- cabecera, subtítulo, progreso ----------
const STEPS = 8;
function header(lt, step, title) {
  const a = eBack(seg(lt, 0, .45));
  ctx.save();
  ctx.translate(540, 190); ctx.scale(a, a);
  ctx.font = '800 34px Inter'; ctx.letterSpacing = '4px';
  const label = `PASO ${step}`; const w = ctx.measureText(label).width + 64;
  ctx.fillStyle = C.acc; rr(-w/2, -34, w, 68, 34); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, 2, 2);
  ctx.restore();
  const b = eOut(seg(lt, .1, .6));
  ctx.save(); ctx.globalAlpha *= b;
  ctx.font = '900 86px Inter'; ctx.letterSpacing = '-1px'; ctx.fillStyle = C.ink;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(title, 540, 330 + (1 - b) * 40);
  ctx.restore();
}
// Bocadillo de diálogo. (x,y) esquina superior izquierda; tail = punta del pico.
function bubble(lt, text, { x = 340, y = 1410, w = 680, size = 42, tail = [260, 1480], delay = .15 } = {}) {
  const a = eBack(seg(lt, delay, delay + .35));
  if (a <= 0) return;
  ctx.save();
  ctx.font = `700 ${size}px Inter`; ctx.letterSpacing = '0px';
  const lh = size * 1.3, lines = wrapLines(text, w - 70);
  const h = 56 + lines.length * lh;
  ctx.translate(tail[0], tail[1]); ctx.scale(a, a); ctx.translate(-tail[0], -tail[1]);
  shadow(1, 30, 10, 0.16);
  ctx.fillStyle = '#fff';
  rr(x, y, w, h, 40); ctx.fill();
  // pico hacia el muñeco
  const by = clamp(tail[1], y + 40, y + h - 40), bx = tail[0] < x ? x : tail[0] > x + w ? x + w : null;
  ctx.beginPath();
  if (bx !== null) { ctx.moveTo(bx, by - 26); ctx.lineTo(tail[0], tail[1]); ctx.lineTo(bx, by + 26); }
  else { const ex = clamp(tail[0], x + 50, x + w - 50), ey = tail[1] > y ? y + h : y; ctx.moveTo(ex - 26, ey); ctx.lineTo(tail[0], tail[1]); ctx.lineTo(ex + 26, ey); }
  ctx.closePath(); ctx.fill();
  shadow(0);
  ctx.fillStyle = C.ink; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, x + 36, y + 28 + lh / 2 + i * lh));
  ctx.restore();
}
function caption(lt, text) { bubble(lt, text); }

// ---------- muñeco de palos ----------
const POSES = {
  idle:   t => [1.30 + .05 * Math.sin(t * 2), 1.40, 1.84 - .05 * Math.sin(t * 2), 1.74],
  wave:   t => [-0.25, -1.30 + .45 * Math.sin(t * 9), 1.84, 1.74],
  point:  t => [-0.40 + .05 * Math.sin(t * 3), -0.50 + .08 * Math.sin(t * 3), 1.90, 1.65],
  explain:t => [-0.15 + .18 * Math.sin(t * 4), -0.95 + .25 * Math.sin(t * 4 + 1), 3.30 - .15 * Math.sin(t * 4), 3.70 - .2 * Math.sin(t * 4 + .5)],
  cheer:  t => [-0.55 + .12 * Math.sin(t * 8), -1.15, 3.69 - .12 * Math.sin(t * 8), 4.29],
};
function stickman(x, feetY, s, pose, t, talking, dark = false) {
  const ink = dark ? '#F5EFE6' : C.ink;
  const jump = pose === 'cheer' ? Math.abs(Math.sin(t * 6)) * 22 : 0;
  const bob = Math.sin(t * 3) * 3;
  ctx.save(); ctx.translate(x, feetY); ctx.scale(s, s);
  ctx.strokeStyle = ink; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // sombra
  ctx.fillStyle = dark ? 'rgba(0,0,0,.35)' : 'rgba(60,40,20,.12)';
  ctx.beginPath(); ctx.ellipse(0, 4, 70 - jump, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.translate(0, -jump);
  const hip = [0, -130 + bob], neck = [0, -248 + bob], sh = [0, -222 + bob];
  // piernas
  const lk = Math.sin(t * 2) * 4;
  ctx.beginPath(); ctx.moveTo(...hip); ctx.lineTo(-22, -65 + lk); ctx.lineTo(-38, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(...hip); ctx.lineTo(22, -65 - lk); ctx.lineTo(38, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-38, 0); ctx.lineTo(-58, 0); ctx.moveTo(38, 0); ctx.lineTo(58, 0); ctx.stroke();
  // cuerpo
  ctx.beginPath(); ctx.moveTo(...hip); ctx.lineTo(...neck); ctx.stroke();
  // brazos
  const [ru, rf, lu, lf] = POSES[pose](t);
  const arm = (a1, a2) => {
    const e = [sh[0] + Math.cos(a1) * 72, sh[1] + Math.sin(a1) * 72];
    const h = [e[0] + Math.cos(a2) * 66, e[1] + Math.sin(a2) * 66];
    ctx.beginPath(); ctx.moveTo(...sh); ctx.lineTo(...e); ctx.lineTo(...h); ctx.stroke();
    ctx.fillStyle = ink; ctx.beginPath(); ctx.arc(h[0], h[1], 9, 0, Math.PI * 2); ctx.fill();
  };
  arm(ru, rf); arm(lu, lf);
  // cinta métrica al cuello
  ctx.save(); ctx.strokeStyle = C.acc2; ctx.lineWidth = 10; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.moveTo(-20, -246 + bob); ctx.quadraticCurveTo(-26, -205 + bob, -22, -168 + bob); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20, -246 + bob); ctx.quadraticCurveTo(26, -215 + bob, 24, -185 + bob); ctx.stroke();
  ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) { const yy = -236 + i * 14 + bob; ctx.beginPath(); ctx.moveTo(-27, yy); ctx.lineTo(-19, yy); ctx.moveTo(19, yy - 4); ctx.lineTo(27, yy - 4); ctx.stroke(); }
  ctx.restore();
  // cabeza
  const hc = [0, -300 + bob];
  ctx.fillStyle = dark ? C.dark : '#fff';
  ctx.beginPath(); ctx.arc(hc[0], hc[1], 48, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // ojos (con parpadeo)
  const blink = (t % 3.1) < 0.12 ? 0.15 : 1;
  ctx.fillStyle = ink;
  for (const ex of [-16, 16]) { ctx.beginPath(); ctx.ellipse(hc[0] + ex + 4, hc[1] - 8, 5.5, 7.5 * blink, 0, 0, Math.PI * 2); ctx.fill(); }

  if (talking) {

    ctx.fillStyle = dark ? '#F5EFE6' : C.ink;
    ctx.beginPath(); ctx.ellipse(hc[0] + 4, hc[1] + 18, 12, 2.5 + o * 10, 0, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(hc[0] + 4, hc[1] + 8, 16, 0.25 * Math.PI, 0.75 * Math.PI); ctx.stroke();
  }
  ctx.restore();
}
function progress(step) {
  const gap = 46, total = (STEPS - 1) * gap + 40, x0 = 540 - total / 2;
  let x = x0;
  for (let i = 1; i <= STEPS; i++) {
    const active = i === step, w = active ? 70 : 18;
    ctx.fillStyle = i < step ? C.acc : active ? C.acc : '#D5C8B5';
    ctx.globalAlpha = i < step ? 0.5 : 1;
    rr(x, 1786, w, 18, 9); ctx.fill(); ctx.globalAlpha = 1;
    x += w + 28;
  }
}

  // zona de rib
  ctx.fillStyle = C.rib; rr(-60, 250, 420, 190, 14); ctx.fill();
  ctx.save(); rr(-60, 250, 420, 190, 14); ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 4;

    const a = eOut(seg(lt, .6 + i * .12, 1.0 + i * .12));

    if (pc.kind === 'p') { tracePts(pc.pts); ctx.fill(); }
    else { rr(...pc.r, 6); ctx.fill(); }
    shadow(0);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.setLineDash(i === 0 && cutP >= 1 ? [] : [10, 8]);
    if (pc.kind === 'p') tracePts(pc.pts); else rr(...pc.r, 6);
    ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = C.muted; ctx.font = '700 26px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (pc.kind === 'p') ctx.fillText(pc.name, pc.lx, pc.ly);
    else ctx.fillText(pc.name, pc.r[0] + pc.r[2] / 2, pc.r[1] + pc.r[3] / 2);
    ctx.restore();
  });

  const path = closed(PIECES[0].pts);

    const q = partial(path, cutP);

  }
  ctx.restore();
  caption(lt, DIALOGO.cortar);
}

  // texto grande, visible desde el primer fotograma
  const z = 1 + 0.12 * (1 - eOut(seg(lt, 0, .35)));
  ctx.save(); ctx.translate(540, 520); ctx.scale(z, z); ctx.translate(-540, -520);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.letterSpacing = '-2px';
  ctx.fillStyle = '#fff'; ctx.font = '900 92px Inter'; ctx.fillText(CONFIG.gancho1, 540, 310);
  const shake = lt < cut ? Math.sin(lt * 40) * 6 * (1 - seg(lt, .2, 1.2)) : 0;
  ctx.fillStyle = C.ink; ctx.font = '900 300px Inter'; ctx.letterSpacing = '-8px';
  ctx.fillText(CONFIG.ganchoPrecio, 540 + shake, 590);
  const pw = ctx.measureText(CONFIG.ganchoPrecio).width;
  ctx.fillStyle = '#fff'; ctx.font = '900 84px Inter'; ctx.letterSpacing = '-2px';
  ctx.fillText(CONFIG.gancho2, 540, 720);
  // tachón rojo sobre el precio
  const sp = eOut(seg(lt, cut - .1, cut + .25));
  if (sp > 0) {
    ctx.strokeStyle = '#D7263D'; ctx.lineWidth = 26; ctx.lineCap = 'round';
    const x0 = 540 - pw / 2 - 20, x1 = 540 + pw / 2 + 20;
    ctx.beginPath(); ctx.moveTo(x0, 520); ctx.lineTo(lerp(x0, x1, sp), lerp(520, 420, sp)); ctx.stroke();
  }
  ctx.restore();
  // sudadera en percha con etiqueta
  const hy = 1150, sw = Math.sin(lt * 2.4) * 0.03;
  ctx.save(); ctx.translate(560, hy - 250); ctx.rotate(sw); ctx.translate(-560, -(hy - 250));
  drawHoodie(560, hy - 190, 0.62, FULL(), lt);
  // etiqueta de precio colgando de la manga
  const tg = [745, hy + 90], ta = Math.sin(lt * 3.1) * 0.15;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(735, hy + 55); ctx.lineTo(tg[0], tg[1]); ctx.stroke();
  ctx.save(); ctx.translate(tg[0], tg[1]); ctx.rotate(0.25 + ta);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(20, 0); ctx.lineTo(48, 30); ctx.lineTo(48, 130); ctx.lineTo(-48, 130); ctx.lineTo(-48, 30); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.acc; ctx.beginPath(); ctx.arc(0, 18, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.ink; ctx.font = '900 40px Inter'; ctx.letterSpacing = '-1px'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('40€', 0, 82);
  if (sp > 0) { ctx.strokeStyle = '#D7263D'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(-36, 50 + 70 * 0); ctx.lineTo(-36 + 72 * sp, 50 + 64 * sp); ctx.moveTo(36, 50); ctx.lineTo(36 - 72 * sp, 50 + 64 * sp); ctx.stroke(); }
  ctx.restore();
  ctx.restore();
  // sello "¡HAZTE LA TUYA!"
  const st = seg(lt, cut, cut + .3);
  if (st > 0) {
    const sc = lerp(2.4, 1, eOut(st)) + Math.sin(seg(lt, cut + .3, cut + .7) * Math.PI) * 0.05;
    ctx.save(); ctx.translate(560, 1230); ctx.rotate(-0.12); ctx.scale(sc, sc); ctx.globalAlpha *= Math.min(1, st * 3);
    ctx.font = '900 92px Inter'; ctx.letterSpacing = '-2px';
    const w = ctx.measureText(CONFIG.ganchoSello).width + 90;
    shadow(1, 40, 16, .35); ctx.fillStyle = C.ink; rr(-w / 2, -80, w, 160, 34); ctx.fill(); shadow(0);
    ctx.strokeStyle = C.acc2; ctx.lineWidth = 8; rr(-w / 2 + 14, -66, w - 28, 132, 26); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(CONFIG.ganchoSello, 0, 6);
    ctx.restore();
  }
}

const SCENES = [
  { d: 3.0, f: sHook, pose: 'explain', k: 'gancho', nobubble: true },
  { d: 4.2, f: sIntro, pose: 'wave', k: 'intro' },
  { d: 6.3, f: sMaterials, step: 1, pose: 'explain', k: 'materiales' },
  { d: 6.6, f: sCut, step: 2, pose: 'point', k: 'cortar' },
  { d: 5.4, f: sPocket, sw: [1.5, 4.3], step: 3, pose: 'explain', k: 'bolsillo' },
  { d: 5.1, f: sShoulders, sw: [1.5, 3.8], step: 4, pose: 'point', k: 'hombros' },
  { d: 5.1, f: sHood, sw: [1.6, 4.2], step: 5, pose: 'explain', k: 'capucha' },
  { d: 5.1, f: sSleeves, sw: [1.5, 3.8], step: 6, pose: 'point', k: 'mangas' },
  { d: 4.8, f: sSides, sw: [0.5, 3.8], step: 7, pose: 'explain', k: 'costados' },
  { d: 5.7, f: sRib, sw: [1.4, 3.8], step: 8, pose: 'point', k: 'rib' },
  { d: 4.5, f: sFinal, pose: 'cheer', k: 'final' },
  { d: 8.4, f: sCTA, last: true, k: 'cta' },
];
// Voz: duración en segundos reales de cada frase (voz/NN.wav, ver voz/duraciones.json). null = sin voz.
const VOZ = [3.6,  2.71,  4.54,  3.28,  4.73,  4.56,  3.59,  4.0,  2.53,  3.45,  2.8,  4.81];
const VOZ_GANCHO_CORTE = 2.5; // segundos desde el inicio de 00.wav hasta "¡Pues hazte la tuya!"
const delayOf = i => i === 0 ? 0.05 : 0.3; // segundos reales desde el inicio de la escena
SCENES.forEach((s, i) => { if (VOZ[i]) s.d = Math.max(s.d, (VOZ[i] + delayOf(i) + 0.45) * SPEED); });
GANCHO_CORTE = (delayOf(0) + VOZ_GANCHO_CORTE) * SPEED;
let TALK = false;
const TOTAL = SCENES.reduce((a, s) => a + s.d, 0);
window.TOTAL = TOTAL;
window.SCENES = SCENES; window.DIALOGO = DIALOGO; window.SPEED = SPEED;
{ let a = 0; window.VOZ_STARTS = SCENES.map((s, i) => { const st = a / SPEED + delayOf(i); a += s.d; return VOZ[i] ? st : null; }); }
// Efectos de sonido (segundos reales) para render.js
{
  let a = 0; const ev = [];
  SCENES.forEach((s, i) => {
    const st = a / SPEED, R = x => st + x / SPEED;
    if (i > 0) ev.push({ t: st, type: 'whoosh' });
    if (!s.last && !s.nobubble) ev.push({ t: R(s.f === sIntro ? .6 : .15), type: 'pop' });
    if (s.f === sHook) { ev.push({ t: st, type: 'pop' }); ev.push({ t: R(GANCHO_CORTE), type: 'thud' }); }
    if (s.sw) ev.push({ t: R(s.sw[0]), d: (s.sw[1] - s.sw[0]) / SPEED, type: 'machine' });
    if (s.f === sCut) for (let x = 2.1; x < 5.2; x += .55) ev.push({ t: R(x), type: 'snip' });
    if (s.f === sFinal) ev.push({ t: R(.05), type: 'tada' });
    if (s.last) { ev.push({ t: R(.7), type: 'pop' }); ev.push({ t: R(2.65), type: 'ding' }); }
    a += s.d;
  });
  window.SFX = ev;
}

window.renderFrame = function (t) {
  let acc = 0, idx = 0;
  while (idx < SCENES.length - 1 && t >= acc + SCENES[idx].d) { acc += SCENES[idx].d; idx++; }
  const sc = SCENES[idx], lt = t - acc;
  TALK = VOZ[idx] ? lt > delayOf(idx) * SPEED && lt < (delayOf(idx) + VOZ[idx]) * SPEED : lt > .4 && lt < sc.d - .5;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.setLineDash([]); shadow(0);
  background();
  if (sc.step) progress(sc.step);
  const fade = sc.last ? 1 : clamp((sc.d - lt) / 0.3);
  ctx.save(); ctx.globalAlpha = fade;
  sc.f(lt, sc.d);
  ctx.restore();
  if (!sc.last) {
    ctx.save(); ctx.globalAlpha = idx === SCENES.length - 2 ? fade : 1;
    const enter = 1;
    stickman(165 - (1 - enter) * 300, 1790, 1, sc.pose, t, TALK);
    ctx.restore();
  }
};

// vista previa en navegador
if (!navigator.webdriver) {
  const start = performance.now();
  const loop = () => { window.renderFrame(((performance.now() - start) / 1000 * SPEED) % TOTAL); requestAnimationFrame(loop); };
  document.fonts.ready.then(loop);
}
